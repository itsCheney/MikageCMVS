[package]
license.workspace = true
name = "cmvs-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Optional CMVS streaming Vorbis decoder and native audio backend"

[lints]
workspace = true

[dependencies]
cmvs-core = { path = "../cmvs-core" }
rodio.workspace = true
lewton.workspace = true

[features]
# Output to the default audio device (cpal). Hosts that pull samples from a mixer
# of their own (cmvs-mobile) build without it.
default = ["device"]
device = ["rodio/playback"]
